[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/shopping"
  to = "/shop"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/terms-of-service"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy"
  status = 301
