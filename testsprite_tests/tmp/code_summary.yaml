version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React 19
  - Vite 6
  - React Router DOM v7
  - Tailwind CSS v4
  - Framer Motion
  - GSAP
  - Three.js / React Three Fiber
  - Lenis smooth scroll
  - Lucide React

routes:
  - path: /
    file: src/pages/Home.tsx
    auth_required: false
    description: Landing / home page with hero, featured products, and sections
  - path: /home
    file: src/pages/Home.tsx
    auth_required: false
    description: Alias for home page
  - path: /shop
    file: src/pages/Shop.tsx
    auth_required: false
    description: Main shop listing page with all coffee products
  - path: /shopping
    file: src/pages/Shop.tsx
    auth_required: false
    description: Alias for shop page
  - path: /category
    file: src/components/CoffeeComponents.tsx
    auth_required: false
    description: Category overview page
  - path: /category/:id
    file: src/pages/CategoryDetail.tsx
    auth_required: false
    description: Filtered product listing by category
  - path: /coffeeDetail/:id
    file: src/pages/ProductDetail.tsx
    auth_required: false
    description: Individual coffee product detail page
  - path: /cart
    file: src/pages/Cart.tsx
    auth_required: false
    description: Shopping cart page with item management
  - path: /payment
    file: src/pages/Payment.tsx
    auth_required: false
    description: Checkout and payment form page
  - path: /account
    file: src/pages/Account.tsx
    auth_required: false
    description: User account page with profile and wishlist
  - path: /orderHistory
    file: src/components/CoffeeComponents.tsx
    auth_required: false
    description: Past orders listing page
  - path: /tracking
    file: src/components/CoffeeComponents.tsx
    auth_required: false
    description: Order tracking page
  - path: /thankyou
    file: src/components/CoffeeComponents.tsx
    auth_required: false
    description: Order confirmation / thank you page
  - path: /search
    file: src/components/CoffeeComponents.tsx
    auth_required: false
    description: Product search results page
  - path: /story
    file: src/components/CoffeeComponents.tsx
    auth_required: false
    description: Scroll-driven coffee story experience
  - path: /about
    file: src/pages/About.tsx
    auth_required: false
    description: Brand story and about page
  - path: /reviews
    file: src/pages/ReviewsPage.tsx
    auth_required: false
    description: Customer reviews page
  - path: /events
    file: src/pages/EventsListing.tsx
    auth_required: false
    description: Events listing page
  - path: /events/:id
    file: src/pages/EventRouter.tsx
    auth_required: false
    description: Individual event detail page (routes to cinematic or standard)
  - path: /social
    file: src/pages/InstagramPage.tsx
    auth_required: false
    description: Instagram / social media gallery page
  - path: /contact
    file: src/pages/Contact.tsx
    auth_required: false
    description: Contact form page
  - path: /terms
    file: src/pages/TermsPage.tsx
    auth_required: false
    description: Terms and conditions / privacy policy page

features:
  - name: Home Page Navigation
    description: Landing page with hero section, featured collections, and navigation to other pages
    files:
      - src/pages/Home.tsx
      - src/components/Navbar.tsx
      - src/components/HomeSections.tsx
    entry_route: /
    user_interactions:
      - View hero section with brand visuals
      - Click navigation links to go to Shop, About, Events, Contact
      - Click cart icon to open cart panel
      - View featured product collection sections
    api_calls: []
    auth_required: false

  - name: Product Shopping
    description: Browse coffee products, view details, add to cart and wishlist
    files:
      - src/pages/Shop.tsx
      - src/pages/ProductDetail.tsx
      - src/pages/CategoryDetail.tsx
      - src/components/CoffeeComponents.tsx
    entry_route: /shop
    user_interactions:
      - Browse product grid on shop page
      - Click on category to filter products
      - Click on a product card to view detail page
      - Click Add to Cart button on product detail
      - Click wishlist heart icon to toggle wishlist
      - View product images carousel on detail page
    api_calls: []
    auth_required: false

  - name: Shopping Cart Management
    description: View, update quantity, and remove items from the cart
    files:
      - src/pages/Cart.tsx
      - src/components/CoffeeComponents.tsx
    entry_route: /cart
    user_interactions:
      - View all cart items with quantities and prices
      - Click increase/decrease quantity buttons
      - Click remove button to delete an item from cart
      - View cart total price
      - Click Proceed to Checkout button to go to payment
      - Open slide-out cart panel from navbar cart icon
    api_calls: []
    auth_required: false

  - name: Checkout and Payment
    description: Fill in shipping and payment details to place an order
    files:
      - src/pages/Payment.tsx
    entry_route: /payment
    user_interactions:
      - Fill in first name and last name fields
      - Fill in email address field
      - Fill in shipping address fields
      - Fill in card number, expiry date, CVV
      - Click Place Order button
      - View order confirmation / thank you page after submission
    api_calls: []
    auth_required: false

  - name: User Account and Wishlist
    description: View account profile and manage wishlisted items
    files:
      - src/pages/Account.tsx
    entry_route: /account
    user_interactions:
      - View account profile section
      - View wishlist tab with saved products
      - Click remove from wishlist button
      - Navigate to order history tab
    api_calls: []
    auth_required: false

  - name: Product Search
    description: Search for coffee products by name or keyword
    files:
      - src/components/CoffeeComponents.tsx
    entry_route: /search
    user_interactions:
      - Type search query in search input field
      - View filtered search results
      - Click on a search result product to view detail
    api_calls: []
    auth_required: false

  - name: Events Listing and Detail
    description: Browse upcoming events and view event details with booking
    files:
      - src/pages/EventsListing.tsx
      - src/pages/EventRouter.tsx
      - src/pages/EventDetail.tsx
      - src/pages/CinematicEventDetail.tsx
      - src/components/EventComponents.tsx
      - src/components/BookingSystem.tsx
    entry_route: /events
    user_interactions:
      - View list of upcoming events
      - Click on an event card to view event detail
      - View event description, date, and location
      - Click Book Now button to open booking form
      - Fill in name, email, number of attendees
      - Submit booking form
    api_calls: []
    auth_required: false

  - name: Contact Form
    description: Send a message to the brand via contact form
    files:
      - src/pages/Contact.tsx
    entry_route: /contact
    user_interactions:
      - Fill in name field
      - Fill in email field
      - Fill in message textarea
      - Click Send Message button
      - View success confirmation message
    api_calls: []
    auth_required: false

  - name: About and Brand Story
    description: Read about the brand, its coffee story, and team
    files:
      - src/pages/About.tsx
      - src/components/CoffeeComponents.tsx
    entry_route: /about
    user_interactions:
      - Scroll through brand story sections
      - View coffee origin story scroll experience at /story
    api_calls: []
    auth_required: false

  - name: Reviews Page
    description: Read customer reviews and ratings
    files:
      - src/pages/ReviewsPage.tsx
      - src/components/Reviews.tsx
    entry_route: /reviews
    user_interactions:
      - View customer review cards with ratings and comments
      - Scroll through review list
    api_calls: []
    auth_required: false

  - name: Social / Instagram Gallery
    description: View brand Instagram feed and social content
    files:
      - src/pages/InstagramPage.tsx
      - src/components/Instagram.tsx
    entry_route: /social
    user_interactions:
      - View grid of Instagram-style photo cards
      - Click on a photo for larger view if applicable
    api_calls: []
    auth_required: false

  - name: Terms and Conditions
    description: Read the platform's terms of service and privacy policy
    files:
      - src/pages/TermsPage.tsx
    entry_route: /terms
    user_interactions:
      - Scroll and read terms sections
      - View table of contents navigation links
    api_calls: []
    auth_required: false

known_limitations:
  - issue: No real backend API; all data (products, events, orders) is stored locally in constants.ts and localStorage
    location: src/constants.ts
    impact: Cart, wishlist, and order history only persist in browser localStorage; no server-side persistence
  - issue: Payment form is UI-only and does not connect to a real payment gateway
    location: src/pages/Payment.tsx
    impact: Submitting payment does not charge any card; it only navigates to thank you page
  - issue: Contact form submission is UI-only with no backend email service connected
    location: src/pages/Contact.tsx
    impact: Messages are not actually sent anywhere
  - issue: Event booking form is UI-only with no backend persistence
    location: src/components/BookingSystem.tsx
    impact: Booking submissions are not stored or confirmed server-side
